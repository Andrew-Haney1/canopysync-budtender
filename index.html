<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CanopySync AI - Text Budtender</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Force the ElevenLabs widget to center nicely in our layout instead of hiding in the corner */
        elevenlabs-convai {
            --elevenlabs-convai-widget-width: 100%;
            --elevenlabs-convai-widget-height: 100%;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col h-screen font-sans">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 flex items-center justify-between shadow-md z-10">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-full bg-emerald-600 flex items-center justify-center font-bold text-lg text-white">AI</div>
            <div>
                <h1 class="font-bold text-base leading-tight">CanopySync AI Budtender</h1>
                <p class="text-xs text-emerald-400 flex items-center mt-0.5">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse mr-1.5"></span> Text Assistant Active
                </p>
            </div>
        </div>
        <div class="text-right">
            <span id="dispensary-name" class="text-xs bg-slate-800 text-slate-300 px-2.5 py-1 rounded-full border border-slate-700">Partner Dispensary</span>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col items-center justify-center p-4 relative w-full max-w-xl mx-auto">
        <div class="text-center space-y-3 mb-6">
            <div class="w-14 h-14 bg-emerald-600/20 border border-emerald-500/40 rounded-full flex items-center justify-center mx-auto text-emerald-400 text-2xl font-bold">🌿</div>
            <h2 class="text-xl font-bold text-white">Ask Your AI Budtender</h2>
            <p class="text-sm text-slate-400 max-w-sm mx-auto">
                Tell us what effects you're looking for, your tolerance level, and any feelings you'd like to avoid. Tap the chat bubble to begin!
            </p>
        </div>

        <!-- ElevenLabs Widget (Fixed Agent ID with 'x' + Expanded/Text-Only attributes) -->
        <elevenlabs-convai 
            agent-id="agent_3801m533p29rez7b5t1xj8ra4gz3" 
            variant="expanded" 
            text-only="true">
        </elevenlabs-convai>
    </main>

    <!-- Footer Disclaimer -->
    <footer class="bg-slate-900 border-t border-slate-800 p-2.5 text-center z-10">
        <p class="text-[10px] text-slate-500">Powered by CanopySync AI • 21+ Age Verification Required at Register</p>
    </footer>

    <!-- Official ElevenLabs Widget Embed Script -->
    <script src="https://unpkg.com/@elevenlabs/convai-widget-embed" async type="text/javascript"></script>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const store = urlParams.get('store');
            if (store) {
                document.getElementById('dispensary-name').innerText = decodeURIComponent(store);
            }
        });
    </script>
</body>
</html>
