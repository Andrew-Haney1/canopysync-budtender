<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CanopySync AI - Text Budtender</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        elevenlabs-convai {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col h-screen font-sans overflow-hidden">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 flex items-center justify-between shadow-md">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-full bg-emerald-600 flex items-center justify-center font-bold text-lg text-white">AI</div>
            <div>
                <h1 class="font-bold text-base leading-tight">CanopySync AI Budtender</h1>
                <p class="text-xs text-emerald-400 flex items-center mt-0.5">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse mr-1.5"></span> Text Assistant Active
                </p>
            </div>
        </div>
        <div class="text-right">
            <span id="dispensary-name" class="text-xs bg-slate-800 text-slate-300 px-2.5 py-1 rounded-full border border-slate-700">Partner Dispensary</span>
        </div>
    </header>

    <!-- Chat Widget Container -->
    <main class="flex-1 flex flex-col items-center justify-center p-3 relative w-full">
        <div class="w-full max-w-xl h-full max-h-[80vh] flex flex-col bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-2xl p-2">
            <!-- ElevenLabs Web Component -->
            <elevenlabs-convai agent-id="agent_3801m533p29rez7b5t1j8ra4gz3"></elevenlabs-convai>
        </div>
    </main>

    <!-- Footer Disclaimer -->
    <footer class="bg-slate-900 border-t border-slate-800 p-2 text-center">
        <p class="text-[10px] text-slate-500">Powered by CanopySync AI • 21+ Age Verification Required at Register</p>
    </footer>

    <!-- ElevenLabs Widget Script -->
    <script src="https://elevenlabs.io/convai-widget/index.js" async type="text/javascript"></script>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const store = urlParams.get('store');
            if (store) {
                document.getElementById('dispensary-name').innerText = decodeURIComponent(store);
            }
        });
    </script>
</body>
</html>
