<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CanopySync AI - Live AI Budtender</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Force the ElevenLabs widget to take up the full main screen area */
        elevenlabs-convai {
            position: fixed !important;
            top: 73px !important;
            bottom: 38px !important;
            left: 0 !important;
            right: 0 !important;
            width: 100% !important;
            height: calc(100vh - 111px) !important;
            --elevenlabs-convai-widget-width: 100vw;
            --elevenlabs-convai-widget-height: calc(100vh - 111px);
            z-index: 40;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col h-screen font-sans overflow-hidden">

    <!-- Header (73px height) -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 flex items-center justify-between shadow-md z-50 h-[73px]">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-full bg-emerald-600 flex items-center justify-center font-bold text-lg text-white">AI</div>
            <div>
                <h1 class="font-bold text-base leading-tight">CanopySync AI Budtender</h1>
                <p class="text-xs text-emerald-400 flex items-center mt-0.5">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse mr-1.5"></span> Text Assistant Active
                </p>
            </div>
        </div>
        <div class="text-right">
            <span id="dispensary-name" class="text-xs bg-slate-800 text-slate-300 px-2.5 py-1 rounded-full border border-slate-700">Partner Dispensary</span>
        </div>
    </header>

    <!-- Full-Screen Widget Area -->
    <main class="flex-1 relative w-full bg-slate-950">
        <elevenlabs-convai 
            id="budtender-widget"
            agent-id="agent_3801m533p29rez7b5t1xj8ra4gz3" 
            variant="expanded" 
            dismissible="false"
            text-only="true">
        </elevenlabs-convai>
    </main>

    <!-- Footer Disclaimer (38px height) -->
    <footer class="bg-slate-900 border-t border-slate-800 p-2.5 text-center z-50 h-[38px] flex items-center justify-center">
        <p class="text-[10px] text-slate-500">Powered by CanopySync AI • 21+ Age Verification Required at Register</p>
    </footer>

    <!-- Official ElevenLabs Widget Embed Script -->
    <script src="https://unpkg.com/@elevenlabs/convai-widget-embed" async type="text/javascript"></script>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            // Dynamic store name from URL (?store=Apotheca)
            const urlParams = new URLSearchParams(window.location.search);
            const store = urlParams.get('store');
            if (store) {
                document.getElementById('dispensary-name').innerText = decodeURIComponent(store);
            }

            // Programmatically auto-expand/start the widget once loaded
            const widget = document.getElementById('budtender-widget');
            const tryAutoOpen = setInterval(() => {
                if (widget && typeof widget.startConversation === 'function') {
                    widget.startConversation();
                    clearInterval(tryAutoOpen);
                } else if (widget && widget.shadowRoot) {
                    // Fallback: click the launcher button inside the shadow DOM if it rendered collapsed
                    const launchBtn = widget.shadowRoot.querySelector('button');
                    if (launchBtn) {
                        launchBtn.click();
                        clearInterval(tryAutoOpen);
                    }
                }
            }, 400);

            // Stop polling after 6 seconds
            setTimeout(() => clearInterval(tryAutoOpen), 6000);
        });
    </script>
</body>
</html>
