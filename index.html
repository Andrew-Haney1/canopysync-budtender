<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CanopySync AI - Live AI Budtender</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col h-screen font-sans overflow-hidden">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 flex items-center justify-between shadow-md z-10">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-full bg-emerald-600 flex items-center justify-center font-bold text-lg text-white">AI</div>
            <div>
                <h1 class="font-bold text-base leading-tight">CanopySync AI Budtender</h1>
                <p class="text-xs text-emerald-400 flex items-center mt-0.5">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse mr-1.5"></span> Live AI & Inventory Active
                </p>
            </div>
        </div>
        <div class="text-right">
            <span id="dispensary-name" class="text-xs bg-slate-800 text-slate-300 px-2.5 py-1 rounded-full border border-slate-700">Partner Dispensary</span>
        </div>
    </header>

    <!-- AI Widget Container Area -->
    <main class="flex-1 flex flex-col items-center justify-center p-2 relative bg-slate-950">
        <!-- ElevenLabs Conversational AI Widget Injection -->
        <!-- Replace agent-id with your actual ElevenLabs Agent ID -->
        <div class="w-full h-full max-w-xl flex flex-col items-center justify-center rounded-2xl border border-slate-800/80 bg-slate-900/40 p-2 shadow-inner">
            <elevenlabs-convai agent-id="agent_3801m533p29rez7b5t1xj8ra4gz3"></elevenlabs-convai>
        </div>
    </main>

    <!-- Footer Disclaimer -->
    <footer class="bg-slate-900 border-t border-slate-800 p-2.5 text-center z-10">
        <p class="text-[10px] text-slate-500">Powered by CanopySync AI • 21+ Age Verification Required at Register</p>
    </footer>

    <!-- ElevenLabs Widget Script -->
    <script src="https://elevenlabs.io/convai-widget/index.js" async type="text/javascript"></script>

    <script>
        // Dynamic Store Name via URL Parameters (e.g., ?store=Apotheca)
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const store = urlParams.get('store');
            if (store) {
                document.getElementById('dispensary-name').innerText = decodeURIComponent(store);
            }
        });
    </script>
</body>
</html>
